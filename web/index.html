<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>proxy-hub</title>
  <link rel="stylesheet" href="./app.css">
  <script defer src="./app.js"></script>
</head>
<body data-page="app">
  <header class="topbar">
    <div class="brand">proxy-hub</div>
    <nav class="tabs" aria-label="主导航">
      <button class="tab active" data-tab="proxies">代理</button>
      <button class="tab" data-tab="settings">设置</button>
      <button class="tab" data-tab="logs">日志</button>
    </nav>
    <button id="logoutBtn" class="ghost">退出</button>
  </header>

  <main class="app-shell">
    <section id="notice" class="notice hidden" role="status" aria-live="polite"></section>

    <section id="proxiesView" class="view active">
      <div class="group-row">
        <label for="groupSelect">分组</label>
        <select id="groupSelect"></select>
        <button id="newGroupBtn">
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3.2v9.6M3.2 8h9.6"/></svg>
          新建分组
        </button>
        <button id="renameGroupBtn" class="secondary">
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="m2.5 13.5 1-3 7-7 2 2-7 7-3 1z"/><path d="m9 5 2 2"/></svg>
          重命名
        </button>
        <button id="deleteGroupBtn" class="danger">
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10"/><path d="M6 4.5V3h4v1.5"/><path d="m4.6 4.5.6 8.6a1 1 0 0 0 1 .9h3.6a1 1 0 0 0 1-.9l.6-8.6"/><path d="M7 7.5v4M9 7.5v4"/></svg>
          删除
        </button>
      </div>

      <div class="toolbar">
        <button id="bulkProxyBtn" class="secondary">
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 4.5h10M3 8h10M3 11.5h10"/></svg>
          管理代理
        </button>
        <button id="latencyBtn" class="accent">
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="9.5" r="4.8"/><path d="M8 9.5V6.8"/><path d="M6.5 2.5h3M8 4V2.5"/></svg>
          延迟测试
        </button>
        <button id="echoBtn" class="accent-alt">
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"><circle cx="8" cy="8" r="5.5"/><path d="M2.5 8h11"/><path d="M8 2.5c1.8 2 1.8 9 0 11M8 2.5c-1.8 2-1.8 9 0 11"/></svg>
          IP回显
        </button>
        <button id="exportBtn" class="ghost">
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v7.5"/><path d="m5 7.5 3 3 3-3"/><path d="M3 13.5h10"/></svg>
          导出
        </button>
        <button id="copyGroupBtn" class="ghost">
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="5.5" width="7.5" height="8" rx="1"/><path d="M10 5.5V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h1.5"/></svg>
          复制本组全部
        </button>
      </div>

      <div class="summary" id="summary"></div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th class="drag-col" aria-hidden="true"></th>
              <th class="check"><input id="selectAll" type="checkbox" aria-label="全选"></th>
              <th>名称</th>
              <th>协议</th>
              <th>Host:Port</th>
              <th>延迟</th>
              <th>出口IP/结果</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="proxyRows"></tbody>
        </table>
      </div>
    </section>

    <section id="settingsView" class="view">
      <form id="settingsForm" class="settings-grid">
        <label>
          <span>并发数</span>
          <input name="concurrency" type="number" min="1" max="200" required>
        </label>
        <label>
          <span>单代理超时 ms</span>
          <input name="timeout_ms" type="number" min="500" max="60000" required>
        </label>
        <label>
          <span>延迟测试 URL</span>
          <select id="testUrlPreset">
            <option value="https://cp.cloudflare.com/generate_204">Cloudflare 204</option>
            <option value="https://www.google.com/generate_204">Google 204</option>
            <option value="custom">自定义</option>
          </select>
        </label>
        <label>
          <span>自定义 URL</span>
          <input name="test_url" type="url" required>
        </label>
        <label>
          <span>成功规则</span>
          <select id="expectedMode">
            <option value="2xx">2xx</option>
            <option value="status">指定状态码</option>
          </select>
        </label>
        <label>
          <span>期望状态码</span>
          <input name="expected_status" type="number" min="0" max="599" required>
        </label>
        <label>
          <span>绿色延迟上限 ms</span>
          <input name="low_latency_ms" type="number" min="1" max="60000" required>
        </label>
        <label>
          <span>红色延迟起点 ms</span>
          <input name="red_latency_ms" type="number" min="2" max="120000" required>
        </label>
        <label class="inline">
          <input name="log_to_file" type="checkbox">
          <span>写入日志文件</span>
        </label>
        <label>
          <span>日志最大 MB</span>
          <input name="log_max_mb" type="number" min="1" max="100" required>
        </label>
        <div class="form-actions">
          <button type="submit">保存</button>
        </div>
      </form>
    </section>

    <section id="logsView" class="view">
      <div class="toolbar">
        <button id="refreshLogsBtn">刷新</button>
        <span class="muted">自动刷新: 2s</span>
      </div>
      <pre id="logBox" class="log-box"></pre>
    </section>
  </main>

  <dialog id="bulkDialog" class="modal">
    <form method="dialog" class="modal-body">
      <h2>管理代理</h2>
      <p class="muted">每行一个代理，支持 socks5://、socks5h://、http://、https://、user:pass@host:port、host:port:user:pass。</p>
      <textarea id="bulkText" spellcheck="false"></textarea>
      <div id="bulkErrors" class="form-error"></div>
      <div class="modal-actions">
        <button id="saveBulkBtn" type="button">保存</button>
        <button class="secondary" value="cancel">取消</button>
      </div>
    </form>
  </dialog>
</body>
</html>
