<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>proxy-hub 登录</title>
  <link rel="stylesheet" href="./app.css">
  <script defer src="./vendor/alpine.min.js"></script>
  <script defer src="./app.js"></script>
</head>
<body data-page="login" class="login-page">
  <main class="login-shell">
    <section class="login-panel">
      <h1>proxy-hub</h1>
      <form id="loginForm" class="login-form">
        <label for="adminKey">管理密钥</label>
        <input id="adminKey" name="key" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">登录</button>
        <p id="loginError" class="form-error" role="alert"></p>
      </form>
    </section>
  </main>
</body>
</html>
